<!DOCTYPE html>
<html>

<head>
	<title>GL Primitives Demo</title>
	<link rel="shortcut icon" href="favicon.png" type="image/png">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="script.js" defer></script>
</head>

<body>
	<div id="app">
		<div id="toolbar">
			<span>GL Primitive:</span>
			<select id="gl-primitive-type">
				<option>GL_POINTS</option>
				<option>GL_LINES</option>
				<option>GL_LINE_LOOP</option>
				<option>GL_LINE_STRIP</option>
				<option>GL_TRIANGLES</option>
				<option>GL_TRIANGLE_STRIP</option>
				<option>GL_TRIANGLE_FAN</option>
			</select>
			<div id="tools">
				<button id="tool-pan">Pan</button>
				<button id="tool-select">Select</button>
				<button id="tool-move">Move</button>
				<button id="tool-draw">Draw</button>
			</div>
			<label style="display: flex;"><input type="checkbox" id="snap-to-grid"> Snap to Grid</label>
			<button id="theme-toggle" type="button" aria-label="Color theme: System">Theme: System</button>
		</div>
		<div id="content">
			<aside id="vertex-sidebar" aria-label="Vertex collection">
				<div id="vertex-sidebar-header">
					<strong>Vertices</strong>
					<div id="vertex-sidebar-actions">
						<span id="vertex-count">0</span>
						<button id="sidebar-pin" type="button" aria-label="Pin sidebar" aria-pressed="false" title="Pin sidebar">pin</button>
						<button id="clear-vertices" type="button">clear</button>
					</div>
				</div>
				<div id="group-actions">
					<button id="group-selected" type="button">group selected</button>
					<button id="ungroup-selected" type="button">ungroup</button>
				</div>
				<div id="vertex-list" role="list"></div>
				<div id="sidebar-resize" role="separator" aria-label="Resize sidebar" title="Resize sidebar"></div>
			</aside>
			<button id="sidebar-handle" type="button" aria-label="Show vertex sidebar" aria-expanded="false">&#8250;</button>
			<canvas id="canv" tabindex="0" aria-label="Drawing canvas"></canvas>
			<canvas id="canv_info"></canvas>
		</div>
	</div>
	<div id="save-dialog" role="dialog" aria-modal="true" aria-labelledby="save-dialog-title" hidden>
		<div id="save-dialog-panel">
			<strong id="save-dialog-title">Restore changes?</strong>
			<p>Saved GL primitives changes were found from the previous session.</p>
			<div id="save-dialog-actions">
				<button id="save-changes" type="button">Restore</button>
				<button id="discard-changes" type="button">Discard</button>
			</div>
		</div>
	</div>
</body>

</html>
